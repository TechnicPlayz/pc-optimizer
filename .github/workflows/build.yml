      - name: Verify build outputs
        shell: pwsh
        run: |
          if (!(Test-Path "publish/VeloraPC.exe")) {
            throw "Missing publish/VeloraPC.exe"
          }

          if (!(Get-ChildItem "dist" -Filter "*.exe" -ErrorAction SilentlyContinue)) {
            throw "No installer EXE found in dist/"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VeloraPC
          path: |
            publish/VeloraPC.exe
            dist/*.exe
          if-no-files-found: error
