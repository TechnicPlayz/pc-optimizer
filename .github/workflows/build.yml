
name: Build Velora PC

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Invalid version: $version. Use tags such as v1.2.3."
          }

          "APP_VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify required files
        shell: pwsh
        run: |
          $required = @(
            "src/VeloraPC/VeloraPC.csproj",
            "installer/VeloraPC.iss",
            "src/VeloraPC/Assets/app.ico",
            "EULA.txt",
            "PRIVACY.txt"
          )

          foreach ($file in $required) {
            if (!(Test-Path $file)) {
              throw "Required file missing: $file"
            }
          }

      - name: Restore Windows x64 dependencies
        shell: pwsh
        run: |
          dotnet restore src/VeloraPC/VeloraPC.csproj `
            --runtime win-x64

          if ($LASTEXITCODE -ne 0) {
            throw "Restore failed."
          }

      - name: Publish Windows x64 Release
        shell: pwsh
        run: |
          if (Test-Path publish) {
            Remove-Item publish -Recurse -Force
          }

          dotnet publish src/VeloraPC/VeloraPC.csproj `
            --configuration Release `
            --framework net8.0-windows `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            "-p:Version=$env:APP_VERSION" `
            --output publish

          if ($LASTEXITCODE -ne 0) {
            throw "Publish failed."
          }

          if (!(Test-Path "publish/VeloraPC.exe")) {
            throw "VeloraPC.exe was not generated."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed."
          }

      - name: Build installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $compiler)) {
            throw "Inno Setup compiler not found: $compiler"
          }

          & $compiler "/DAppVersion=$env:APP_VERSION" "installer/VeloraPC.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer compilation failed."
          }

          $installer = "dist/VeloraPC-Setup-$env:APP_VERSION.exe"

          if (!(Test-Path $installer)) {
            throw "Expected installer missing: $installer"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VeloraPC-Windows
          path: |
            publish/VeloraPC.exe
            dist/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora PC v${{ env.APP_VERSION }}
          generate_release_notes: true
          files: |
            publish/VeloraPC.exe
            dist/*.exe
          fail_on_unmatched_files: true
