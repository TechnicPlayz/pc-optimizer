name: Build Velora PC

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin .NET 8 SDK (the runner also has SDK 10 installed)
        shell: pwsh
        run: |
          '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' | Set-Content -Path global.json -Encoding utf8
          dotnet --version

      - name: Work out version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = '1.0.0' }
          # the app version needs three numbers (v1.1 -> 1.1.0)
          if (($v -split '\.').Count -eq 2) { $v = "$v.0" }
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish single-file EXE
        shell: pwsh
        run: |
          dotnet publish src/VeloraPC/VeloraPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true "-p:Version=$env:APP_VERSION" -o publish 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" installer\VeloraPC.iss 2>&1 | Tee-Object -FilePath iscc.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Show errors on the run page
        if: failure()
        shell: pwsh
        run: |
          foreach ($f in 'build.log', 'iscc.log') {
            if (Test-Path $f) {
              $errs = Select-String -Path $f -Pattern ': error |Error on line|Error:' | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique | Select-Object -First 8
              foreach ($e in $errs) {
                $m = ($e -replace '%', '%25') -replace "`r", ''
                Write-Host "::error title=Build error::$m"
              }
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VeloraPC
          path: |
            publish/VeloraPC.exe
            dist/*.exe

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build.log
            iscc.log

      - name: Attach to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/VeloraPC.exe
            dist/*.exe
